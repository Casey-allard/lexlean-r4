[package]
name = "uor-foundry-v13-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
lexlean-r4-wasm = { path = "/Users/casey.allard/lexlean-r4/crates/wasm" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
wasm-bindgen = "=0.2.122"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
