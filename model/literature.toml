abstract = "In this letter, we study pairwise distances between sequences with a common aperiodic autocorrelation function. First, we show that pairwise distances are determined by a ternary signed pattern encoding the relative zero flips between spectral factors. Then, for Huffman sequences, we prove that Dihedral symmetries of the zeros preserve pairwise distances, and we further derive lower bounds on the minimum distance. The results in this letter offer a starting point for designing codes with a fixed autocorrelation. These codes are relevant in integrated sensing and communication."
