    "math.OC",
]
abstract = 'This paper investigates the boundary observability for a class of multi-dimensional degenerate Kolmogorov-type kinetic equations in a cylindrical domain $Ω= \mathbb{T}_{x_1} \times (0,1)_{x_2}$. The model features a horizontal drift term $x_2^γ\partial_{x_1} \varphi$ coupled with a boundary-degenerate diffusion operator $\partial_{x_2}(x_2^α\partial_{x_2} \varphi)$ acting solely on the velocity variable, where $γ= 1$ and $α\in (0,1)$. By leveraging the structural advantages of the cylindrical domain, we establish an analytical framework based on the method of separation of variables. Crucial Carleman estimates tailored to the degenerate dual operator are derived to capture the subtle dissipation effects under the influence of the transport term. Consequently, by virtue of a uniform a priori estimate, we establish the quantitative boundary observability inequality for the state function.'
