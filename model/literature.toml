[[paper]]
arxiv_id = "2611.34899"
title = "Enhancing Maritime Domain Awareness using Latent Space Representations"
authors = [
    "Rikard Vinge",
    "Miguel A. Belenguer-Plomer",
    "Isabelle Wittmann",
    "Octavian Dumitru",
    "Michele Lazzarini",
