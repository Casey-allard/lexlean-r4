[[paper]]
arxiv_id = "2403.05530"
title = "Direct Preference Optimization: Your Language Model is Secretly a Reward Model"
authors = [
    "Rafael Rafailov",
    "Archit Sharma",
    "Eric Mitchell",
    "Stefano Ermon",
    "Christopher D. Manning",
    "Chelsea Finn",
]
published = "2023-05-29T17:42:00Z"
updated = "2024-03-08T18:00:00Z"
primary_category = "cs.LG"
categories = [
    "cs.LG",
    "cs.AI",
    "stat.ML",
]
abstract = "While simple, the typical RLHF pipeline is complex and often unstable. We show that the optimization problem can be solved exactly by reparameterizing the reward function with the policy itself. This yields Direct Preference Optimization (DPO), which optimizes language model alignment directly on preference pairs via cross-entropy without training an explicit reward model or sampling during fine-tuning."

