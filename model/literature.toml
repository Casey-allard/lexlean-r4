family = "dialogue-stem"
statement = "Verify that Direct Preference Optimization establishes closed-form cross-entropy alignment over preference pairs without an explicit reward model."
prompt = "How does Direct Preference Optimization align language models without reinforcement learning?"
target_reply = "Direct Preference Optimization trains policies directly on preference pairs using closed form implicit reward substitution."

