[[paper]]
arxiv_id = "2611.34590"
title = "Sequential Portfolio Optimizer (SPO-CPU and SPO-GPU): C++ Interior-Point Solvers and Differentiable Layers for Quadratic Cone Programs"
authors = [
    "Fan Zhao",
    "Yan Zaretskiy",
    "Yuwen Chen",
    "Jerry Shi",
]
published = "2026-11-25T15:51:33Z"
updated = "2026-11-25T15:51:33Z"
primary_category = "math.OC"
categories = ["math.OC"]
abstract = 'Quadratic cone programs (QCPs) are a practical canonical form for convex optimization, including parametric portfolio problems that must be re-solved to high accuracy as market data change. We present Sequential Portfolio Optimizer (SPO), with SPO-CPU and SPO-GPU the C++ and CUDA realizations of the Clarabel homogeneous-embedding interior-point method. Clarabel is a registered trademark; SPO is our name for these implementations. Each exposes a forward optimizer and an in-solver differentiable layer. The Mehrotra algorithm is unchanged. The contribution is an implementation stack: a reduced two-block vector-Jacobian product with gradients in the original coordinates; a documented variant of the Chen--Goulart--Jones smoothing warm start, applied in equilibrated coordinates; and a GIL-free GPU batch architecture whose isolated throughput is at parity with a warm solver loop up to $B{=}16$. On an RTX A6000, subsequent solves of a $5000$-asset factor-model QP average $24$ ms on SPO-GPU, compared with $98$ ms on Clarabel.rs and $122$ ms on single-thread Gurobi; at $10{,}000$ assets the corresponding GPU time is $59$ ms against $439$ ms for one-thread Mosek. Clarabel.rs, SPO-CPU, and SPO-GPU agree pairwise to $2.2{\times}10^{-7}$ in relative objective on this family. Against a CVXPYLayers baseline driven by Clarabel, the GPU layer reproduces the solution and the return-gradient on a $5000$-asset factor QP/SOCP, while a subsequent forward-plus-backward step is $101$--$137\times$ faster at $5000$ assets (and $17$--$30\times$ at $1000$ assets). The smoothing warm start reduces QP rebalance iterations but can increase them on a large GPU second-order cone. Wall-clock rankings apply to the factor-model family only; an $18$-problem Maros--Mészáros subset is reported as a cross-check. We do not claim a speedup over CuClarabel, and the batch architecture is not a measured throughput improvement.'
hypothesis = []

[[paper]]
arxiv_id = "2611.34584"
title = "Routing and Cache Retention for Multi-Turn LLM Inference: Theory and Implementation"
authors = [
    "Sentao Miao",
    "Tianjiao Nie",
    "Yuan Zhou",
    "Song Yuan",
    "Yuanwei Lu",
    "Yibo Zhu",
]
published = "2026-11-25T15:45:44Z"
updated = "2026-11-25T15:45:44Z"
primary_category = "math.OC"
categories = ["math.OC"]
abstract = 'Multi-turn AI agents execute iterative loops of large language model (LLM) inference and external tool calls, transforming cluster serving into a dynamic resource-allocation problem where routing and key-value (KV) cache retention jointly govern prefix reuse across inter-turn delays. We formulate a fluid approximation of this system and show that optimal admission, routing, and eviction are governed by endpoint-specific shadow prices for computation and memory together with session continuation values. Building on this structure, we propose an asymptotically optimal buffer-reserve policy that absorbs stochastic fluctuations using a vanishing share of capacity. To handle asynchronous arrivals, delayed load reports, and engine-local memory management in production clusters, we translate these principles into a practical controller named PARK, which pairs online projected subgradient price updates and one-turn migration lookahead with a local KV retention index ranked by expected reuse value per byte-epoch. In real GPU cluster experiments serving a 197-billion-parameter mixture-of-experts model on multi-turn software-engineering agent benchmarks (SWE and Terminal-Bench), PARK outperforms all five load-balancing and prefix-aware baselines across contrasting traffic regimes. On 16 H200 GPUs, PARK raises output throughput by $24.2\%$ over the strongest baseline ($336.9\%$ over round robin) on turn-intensive SWE trajectories and by $40.0\%$ over the strongest baseline ($63.3\%$ over round robin) on generation-intensive Terminal-Bench trajectories. Controlled single-replica ablations show that our retention index alone cuts prior-prefix token loss from $13.26\%$ to $2.17\%$ and increases throughput by $36.7\%$ over least-recently-used (LRU) eviction, while 128-GPU scale-up experiments sustain 50,789 to 67,363 output tokens/s across 16~replicas with prefix cache hit rates of $91.3\%$ to $97.4\%$.'
