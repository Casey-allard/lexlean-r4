abstract = "Lock-free concurrent data structures avoid mutual exclusion but face the fundamental challenge of safe memory reclamation without garbage collection. We present a bounded epoch-based memory reclamation algorithm that guarantees constant-time retirement and prevents unbounded memory growth under arbitrary thread scheduling delays."

