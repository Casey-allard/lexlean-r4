# model/authorities.toml --- what this repository cites rather than proves.
#
# A `some-true` claim is reproduced from an authority and is not established
# here. This file is where the authority is named well enough for a third party
# to find it, with a checksum over the committed artifact when there is one and
# a stated reason when there is not.
#
# `realized_by` lists the conformance IDs that are *evidence* this repository
# realizes the cited fact. Evidence is not proof, and the meta-gate fails the
# build if any document blurs the two registers.
#

spec = "template/1"

[[authority]]
id = "UOR-DISCRETE-SPEC"
name = "UOR-R4 discrete engine configuration"
citation = "https://github.com/UOR-Foundation/uor-r4/blob/4611538bb4843947363ccb9cce5f388e32c46883/crates/uor-r4-discrete/src/lib.rs — Spec::validate"
checksum = "sha256:ffa7d22a9471071a18aa33ff67376ee7f1fafefa4e774ddcd50210b7d54c2ad9"
statement = "The pinned discrete-engine source defines the configuration bounds reproduced by the LexLean predicate. This citation establishes source provenance, not scientific capability or port parity."
realized_by = ["R4-01"]
