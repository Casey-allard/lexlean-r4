# model/routes.toml --- Total UORust-aligned route table for LexLean-R4 (`uorust/routes/1`).
#
# Maps repository facts (Rust crates, LexLean semantic modules, Holo OPFS pieces,
# Wasm simd128 kernels, Q31 SpiralCore/FBS lanes, browser Worker RPC routes, UORust
# function-kappa ratchets, and PrismPM release packs) onto Foundation.* Prism records
# and facets (arch, features, behavior, design, sec, qual, release).

spec = "uorust/routes/1"
max_request_bytes = 330

[[route]]
id = "R4-UR01"
rust_fact = "crate-bin-target"
prism_record = "Foundation.Arch::Component"
facet = "arch"
note = "Binary target mapped as an executable release component."

