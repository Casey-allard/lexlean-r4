[[vector]]
case = "error empty"
request_hex = ""
response = "error empty"

[[vector]]
case = "refused unknown fact"
request_hex = "756e6b6e6f776e2d66616374"
response = "refused unknown-fact\nfact unknown-fact"

[[vector]]
case = "refused ambiguous two routes"
request_hex = "63726174652d62696e2d7461726765740a686f6c6f2d6b617070612d7069656365"
response = "refused ambiguous\nfact crate-bin-target\nfact holo-kappa-piece"
