name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: build and verify browser application
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run preflight acceptance gate through the locked SDK
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          if test -f "$HOME/.docker/config.json"; then
            cp "$HOME/.docker/config.json" "$docker_config/config.json"
          else
            printf '{}\n' >"$docker_config/config.json"
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            --env SDK_IMAGE="$image" \
            "$image" bash -c '
              set -euo pipefail
              umask 077
              exec just vv
            '

      - name: Verify browser closure and provenance
        shell: bash
        run: |
          set -euo pipefail
          closure_files=(
            "public/index.html"
            "public/app.js"
            "public/app.css"
            "public/lexlean_r4.js"
            "public/lexlean_r4_bg.wasm"
            "public/provenance.json"
          )
          for file in "${closure_files[@]}"; do
            if [ ! -s "$file" ]; then
              printf '::error::Missing or empty closure file: %s\n' "$file" >&2
              exit 1
            fi
          done

          if ! jq empty public/provenance.json 2>/dev/null; then
            printf '::error::public/provenance.json is not valid JSON\n' >&2
            exit 1
          fi

          schema=$(jq -r '.schema // empty' public/provenance.json)
          if [ "$schema" != "prismpm/browser-provenance/1" ]; then
            printf '::error::Schema mismatch: expected prismpm/browser-provenance/1, got %s\n' "$schema" >&2
            exit 1
          fi

          touch public/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

  deploy:
    name: deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
