name: pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and verify browser application
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: 'pages-build-${{ github.ref }}'
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore LexLean verification cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lexlean
          key: r4-pages-lexlean-v1-${{ hashFiles('prismpm.lock', 'lexlean.toml', 'lexlean.lock') }}-${{ hashFiles('src/R4/**/*.lex.tex', 'tests/lexlean/**/*.lex.tex') }}
          restore-keys: |
            r4-pages-lexlean-v1-${{ hashFiles('prismpm.lock', 'lexlean.toml') }}-
            r4-pages-lexlean-v1-

      - name: Restore RustSec advisory-db cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .r4-advisory-dbs
          key: r4-advisory-dbs-v1-${{ hashFiles('Cargo.lock', 'deny.toml') }}
          restore-keys: |
            r4-advisory-dbs-v1-

      - name: Restore Cargo target cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: r4-pages-target-v2-${{ hashFiles('Cargo.lock') }}-${{ hashFiles('Cargo.toml', 'crates/**/Cargo.toml', 'xtask/Cargo.toml', 'crates/**/src/**/*.rs', 'crates/**/tests/**/*.rs', 'xtask/src/**/*.rs', 'xtask/tests/**/*.rs', 'crates/wasm/src/*.uorlut', 'crates/wasm/src/*.bin', 'src/R4/**/*.lex.tex') }}
          restore-keys: |
            r4-pages-target-v2-${{ hashFiles('Cargo.lock') }}-
            r4-pages-target-v2-

      - name: Run preflight acceptance gate through the locked SDK
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          if test -f "$HOME/.docker/config.json"; then
            cp "$HOME/.docker/config.json" "$docker_config/config.json"
          else
            printf '{}\n' >"$docker_config/config.json"
          fi
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=6g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            --env SDK_IMAGE="$image" \
            "$image" bash -c '
              set -euo pipefail
              umask 077
              if [ -d .r4-advisory-dbs ] && [ -n "${CARGO_HOME:-}" ]; then
                mkdir -p "$CARGO_HOME/advisory-dbs"
                cp -a .r4-advisory-dbs/. "$CARGO_HOME/advisory-dbs/" || true
              fi
              cargo deny fetch db || true
              if [ -n "${CARGO_HOME:-}" ] && [ -d "$CARGO_HOME/advisory-dbs" ]; then
                rm -rf .r4-advisory-dbs
                mkdir -p .r4-advisory-dbs
                cp -a "$CARGO_HOME/advisory-dbs/." .r4-advisory-dbs/ || true
              fi
              exec just vv
            '

      - name: Prune Cargo incremental cache
        if: always()
        shell: bash
        run: |
          rm -rf target/debug/incremental target/wasm32-unknown-unknown/release/incremental || true
          if [ -d target/debug/deps ]; then
            find target/debug/deps -maxdepth 1 -type f -executable ! -name '*.so' -mtime +1 -delete || true
          fi

      - name: Verify browser closure and provenance
        shell: bash
        run: |
          set -euo pipefail
          closure_files=(
            "public/index.html"
            "public/app.js"
            "public/app.css"
            "public/lexlean_r4.js"
            "public/lexlean_r4_bg.wasm"
            "public/provenance.json"
          )
          for file in "${closure_files[@]}"; do
            if [ ! -s "$file" ]; then
              printf '::error::Missing or empty closure file: %s\n' "$file" >&2
              exit 1
            fi
          done

          if ! jq empty public/provenance.json 2>/dev/null; then
            printf '::error::public/provenance.json is not valid JSON\n' >&2
            exit 1
          fi

          schema=$(jq -r '.schema // empty' public/provenance.json)
          if [ "$schema" != "prismpm/browser-provenance/1" ]; then
            printf '::error::Schema mismatch: expected prismpm/browser-provenance/1, got %s\n' "$schema" >&2
            exit 1
          fi

          touch public/.nojekyll
          if [ -f site/app.json ]; then cp site/app.json public/app.json; fi
          if [ -f site/coi-serviceworker.js ]; then cp site/coi-serviceworker.js public/coi-serviceworker.js; fi
          if [ -f site/icons/icon-192.png ]; then
            mkdir -p public/icons
            cp site/icons/icon-192.png public/icons/icon-192.png
          fi
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:$PWD" \
            --workdir "$PWD" \
            "$image" ./target/debug/xtask build-holo --out public/app.holo --emit-fingerprint-dir public/holo --verify-site-manifest
          if [ -d gpu/weights ]; then
            cp -R gpu/weights public/weights
            find public/weights -type f \( -name "*.bin" -o -name "*.pack" -o -name "*.part*" \) -delete
          fi

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    name: deploy to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: build
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: 'pages-deploy'
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 600000
          error_count: 25

  continue-ratchet:
    name: dispatch next autonomous ratchet tick after live deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [build, deploy]
    if: always() && github.repository == 'Casey-allard/lexlean-r4' && github.ref == 'refs/heads/main' && vars.R4_ENGINE != 'off'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch next r4-engine tick or bounded Pages retry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          EVENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DEPLOY_RESULT" = "success" ]; then
            active_engine=$(gh run list --workflow=engine.yml --limit 5 --json status --jq '[.[] | select(.status != "completed")] | length')
            if [ "${active_engine:-0}" = "0" ]; then
              gh workflow run engine.yml --ref main
            fi
          elif [ "$BUILD_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "timed_out" ] || [ "$DEPLOY_RESULT" = "failure" ] || [ "$DEPLOY_RESULT" = "timed_out" ]; then
            tip_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
            failed_pages_on_tip=$(gh api "repos/$GH_REPO/actions/workflows/pages.yml/runs?branch=main&head_sha=$tip_sha&per_page=10" --jq "[.workflow_runs[] | select(.id == $CURRENT_RUN_ID or (.status == \"completed\" and (.conclusion == \"failure\" or .conclusion == \"timed_out\")))] | length")
            active_other_pages=$(gh run list --workflow=pages.yml --limit 10 --json databaseId,status --jq "[.[] | select(.databaseId != $CURRENT_RUN_ID and .status != \"completed\")] | length")
            if [ "$tip_sha" = "$EVENT_SHA" ] && [ "${failed_pages_on_tip:-0}" -lt 3 ] && [ "${active_other_pages:-0}" = "0" ]; then
              gh workflow run pages.yml --ref main
            fi
          fi
