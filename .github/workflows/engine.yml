# Generated by `bin/r4 api sync` from src/R4/AutonomousEngine.lex.tex (xtask/src/engine.rs).
# Do not edit: `bin/r4 api check` refuses drift. The kernel decides the facts this file rests on
# (AutonomousEngine.lex.tex): no secret but GITHUB_TOKEN, contents/actions/pull-requests write only,
# the stage budgets within the timeout, the cron off the hour, one concurrency group that never cancels a run.
name: Engine

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/R4/**"
      - "tests/lexlean/**"
      - "xtask/**"
      - "crates/wasm/**"
      - "public/**"
      - "model/**"
      - "frontier.toml"
      - "bin/**"
      - "README.md"
      - "docs/CONTINUATION.md"
      - ".github/workflows/engine.yml"

concurrency:
  group: r4-engine
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  pull-requests: write

jobs:
  tick:
    name: One tick of the engine
    if: github.repository == 'Casey-allard/lexlean-r4' && vars.R4_ENGINE != 'off'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      outcome: ${{ steps.tick.outputs.outcome }}
      pushed: ${{ steps.tick.outputs.pushed }}
      head_sha: ${{ steps.tick.outputs.head_sha }}
    steps:
      - name: Checkout (full history, so the tick can push)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Is this commit still the tip of main
        id: tip
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          local_head=$(git rev-parse HEAD)
          head_author=$(git log -1 --format='%an' HEAD)
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ "$head_author" = "r4-engine" ]; then
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
          elif [ "$local_head" = "$remote_head" ]; then
            printf 'current=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'current=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Is this commit settled
        id: settled
        if: steps.tip.outputs.current == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .r4-settled
          key: r4-settled-${{ github.sha }}
          lookup-only: true

      - name: Restore LexLean verification cache
        if: steps.tip.outputs.current == 'true' && steps.settled.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lexlean
          key: r4-pages-lexlean-v1-${{ github.sha }}
          restore-keys: |
            r4-pages-lexlean-v1-

      - name: Restore Cargo target cache
        if: steps.tip.outputs.current == 'true' && steps.settled.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target
          key: r4-engine-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            r4-engine-target-

      - name: Restore RustSec advisory-db cache
        if: steps.tip.outputs.current == 'true' && steps.settled.outputs.cache-hit != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .r4-advisory-dbs
          key: r4-advisory-dbs-v1-${{ hashFiles('Cargo.lock', 'deny.toml') }}
          restore-keys: |
            r4-advisory-dbs-v1-

      - name: Run autonomous homeostasis tick through the locked SDK
        id: tick
        if: steps.tip.outputs.current == 'true' && steps.settled.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config" .r4-engine-output.env' EXIT
          if test -f "$HOME/.docker/config.json"; then
            cp "$HOME/.docker/config.json" "$docker_config/config.json"
          else
            printf '{}\n' >"$docker_config/config.json"
          fi
          rm -f .r4-engine-output.env .r4-engine-status.txt
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=6g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            --env SDK_IMAGE="$image" \
            --env GITHUB_TOKEN="$GITHUB_TOKEN" \
            --env CARGO_INCREMENTAL=0 \
            --env CARGO_PROFILE_DEV_DEBUG=0 \
            --env CARGO_PROFILE_TEST_DEBUG=0 \
            --env R4_ENGINE_OUTPUT_FILE=".r4-engine-output.env" \
            "$image" bash -c '
              set -euo pipefail
              umask 077
              if [ -d .r4-advisory-dbs ] && [ -n "${CARGO_HOME:-}" ]; then
                mkdir -p "$CARGO_HOME/advisory-dbs"
                cp -a .r4-advisory-dbs/. "$CARGO_HOME/advisory-dbs/" || true
              fi
              cargo deny fetch db || true
              cargo run -q -p xtask -- mechanize
              cargo run -q -p xtask -- lift-register
              cargo run -q -p xtask -- ratchet-check
              cargo run -q -p xtask -- synthesize --write
              cargo run -q -p xtask -- literature-sync --offline-fallback --write || true
              cargo run -q -p xtask -- engine tick --budget-minutes 75 --commit --push
              cargo run -q -p xtask -- engine status > .r4-engine-status.txt || true
              if [ -n "${CARGO_HOME:-}" ] && [ -d "$CARGO_HOME/advisory-dbs" ]; then
                rm -rf .r4-advisory-dbs
                mkdir -p .r4-advisory-dbs
                cp -a "$CARGO_HOME/advisory-dbs/." .r4-advisory-dbs/ || true
              fi
              rm -rf target/debug/incremental target/wasm32-unknown-unknown/release/incremental || true
            '
          if [ -f .r4-engine-output.env ]; then
            outcome_val=$(sed -n 's/^outcome=//p' .r4-engine-output.env)
            pushed_val=$(sed -n 's/^pushed=//p' .r4-engine-output.env)
            tick_branch=$(sed -n 's/^tick_branch=//p' .r4-engine-output.env)
            head_sha=$(sed -n 's/^head_sha=//p' .r4-engine-output.env)
            rm -f .r4-engine-output.env
            if [ "$outcome_val" = "advanced" ] && [ "$pushed_val" != "true" ]; then
              printf '%s\n' 'engine tick advanced locally without pushing to origin/main' >&2
              exit 1
            fi
            {
              printf 'outcome=%s\n' "$outcome_val"
              printf 'pushed=%s\n' "$pushed_val"
              printf 'tick_branch=%s\n' "$tick_branch"
              printf 'head_sha=%s\n' "$head_sha"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Save LexLean verification cache
        if: steps.tip.outputs.current == 'true' && steps.settled.outputs.cache-hit != 'true' && steps.tick.outputs.pushed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .lexlean
          key: r4-pages-lexlean-v1-${{ steps.tick.outputs.head_sha }}

      - name: Tick summary
        if: always() && steps.tip.outputs.current == 'true' && steps.settled.outputs.cache-hit != 'true'
        shell: bash
        run: |
          {
            echo "outcome: ${{ steps.tick.outputs.outcome }}"
            echo '```'
            if [ -f .r4-engine-status.txt ]; then
              cat .r4-engine-status.txt
              rm -f .r4-engine-status.txt
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Mark the commit settled
        if: always() && steps.tip.outputs.current == 'true' && steps.settled.outputs.cache-hit != 'true' && contains(fromJSON('["idle", "settled"]'), steps.tick.outputs.outcome)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .r4-settled
          key: r4-settled-${{ github.sha }}

      - name: Keep the newest entry of each cache family
        if: always() && steps.tip.outputs.current == 'true' && steps.settled.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          for family in r4-engine-target r4-settled r4-advisory-dbs-v1; do
            gh cache list --key "$family-" --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' \
              | xargs -r -n1 gh cache delete || true
          done
          gh cache list --key "r4-pages-lexlean-v1-" --sort created_at --order desc --limit 100 --json id --jq '.[3:][].id' \
            | xargs -r -n1 gh cache delete || true

      - name: Publish the view of the pushed commit
        if: steps.tip.outputs.current == 'true' && steps.settled.outputs.cache-hit != 'true' && steps.tick.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref main

  relay:
    name: Relay pushed commit to Pages or retry transient tick failure
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: tick
    if: always() && github.repository == 'Casey-allard/lexlean-r4' && vars.R4_ENGINE != 'off'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch Pages on push or bounded retry on transient failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TICK_RESULT: ${{ needs.tick.result }}
          TICK_PUSHED: ${{ needs.tick.outputs.pushed }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TICK_PUSHED" = "true" ]; then
            tip_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
            existing_pages=$(gh api "repos/$GH_REPO/actions/workflows/pages.yml/runs?branch=main&head_sha=$tip_sha&per_page=5" --jq '.workflow_runs | length')
            if [ "${existing_pages:-0}" = "0" ]; then
              gh workflow run pages.yml --ref main
            fi
          elif [ "$TICK_RESULT" = "failure" ] || [ "$TICK_RESULT" = "timed_out" ]; then
            tip_sha=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
            settled_hit=$(gh api "repos/$GH_REPO/actions/caches?key=r4-settled-$tip_sha&per_page=1" --jq '.actions_caches | length')
            failed_on_tip=$(gh api "repos/$GH_REPO/actions/workflows/engine.yml/runs?branch=main&head_sha=$tip_sha&per_page=10" --jq "[.workflow_runs[] | select(.id == $CURRENT_RUN_ID or (.status == \"completed\" and (.conclusion == \"failure\" or .conclusion == \"timed_out\")))] | length")
            active_other=$(gh run list --workflow=engine.yml --limit 10 --json databaseId,status --jq "[.[] | select(.databaseId != $CURRENT_RUN_ID and .status != \"completed\")] | length")
            if [ "${settled_hit:-0}" = "0" ] && [ "${failed_on_tip:-0}" -lt 3 ] && [ "${active_other:-0}" = "0" ]; then
              gh workflow run engine.yml --ref main
            fi
          fi
