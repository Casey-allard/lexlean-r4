[package]
name = "repo-conformance"
description = "The BDD runner and the honesty meta-gate. Dev and CI only; never a dependency of a shipped crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
repo-model = { workspace = true }

[dev-dependencies]
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[build-dependencies]
syn = { version = "=3.0.9", features = ["full", "visit"] }

[lints]
workspace = true
